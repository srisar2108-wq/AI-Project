<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat with Gemini</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #1e1b2e; color: #fff; height: 100vh; overflow: hidden; }

    .layout { display: flex; height: 100vh; }

    /* Sidebar */
    .sidebar { width: 260px; background: #15122a; display: flex; flex-direction: column; border-right: 1px solid #2a2640; }
    .sidebar-top { padding: 12px; }
    .new-chat { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #3b6fd8; color: #fff; cursor: pointer; font-size: 14px; }
    .chat-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
    .group-title { font-size: 12px; color: #9a94b8; margin: 14px 8px 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .chat-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; color: #ddd; }
    .chat-item:hover { background: #2a2640; }
    .chat-item.active { background: #35304d; color: #fff; }
    .chat-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .delete-btn, .rename-btn { background: none; border: none; color: #9a94b8; cursor: pointer; font-size: 16px; padding: 0 4px; }    .delete-btn:hover { color: #ff7b7b; }
    .search-box { width: 100%; margin-top: 8px; padding: 8px 10px; border: none; border-radius: 8px; background: #2a2640; color: #fff; font-size: 14px; }
    .pin-btn { background: none; border: none; color: #9a94b8; cursor: pointer; font-size: 13px; padding: 0 4px; }
    .pin-btn.active { color: #ffd166; }
    .empty-note { color: #9a94b8; font-size: 13px; padding: 10px; }
    .projects-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 4px; font-size: 12px; color: #9a94b8; text-transform: uppercase; letter-spacing: 0.5px; }
    #newProject { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
    .project-list { padding: 0 8px 6px; }
    .move-btn { background: none; border: none; color: #9a94b8; cursor: pointer; font-size: 13px; padding: 0 4px; }
    .project-item { display: flex; align-items: center; gap: 4px; padding: 7px 8px; border-radius: 8px; font-size: 14px; color: #fff; font-weight: bold; }
    .project-item:hover { background: #2a2640; }
    .project-arrow { width: 14px; color: #9a94b8; cursor: pointer; font-size: 11px; }
    .project-name { flex: 1; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .project-add { background: none; border: none; color: #9a94b8; cursor: pointer; font-size: 16px; padding: 0 4px; }
    .chat-item.nested { margin-left: 18px; }
    .empty-note.nested { margin-left: 18px; }

    /* Main chat area */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .main-header { padding: 14px 18px; background: #2a2640; font-weight: bold; }
    #messages { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; margin: 8px 0; white-space: pre-wrap; line-height: 1.45; }
    .bubble.user { background: #3b6fd8; margin-left: auto; }
    .bubble.bot { background: #35304d; }

    #chatForm { display: flex; gap: 8px; padding: 12px 16px; background: #2a2640; }
    #input { flex: 1; padding: 10px; border-radius: 8px; border: none; resize: none; font-size: 15px; font-family: inherit; }
    #send { padding: 10px 18px; border: none; border-radius: 8px; background: #3b6fd8; color: #fff; cursor: pointer; }
    #send:disabled { opacity: 0.5; cursor: default; }

    @media (max-width: 700px) {
      .sidebar { width: 200px; }
    }
    html, body { min-height: 100%; }

body {
  background: linear-gradient(-45deg, #1b1f4b, #3b1f5c, #0f3d4c, #1e2a6b);
  background-size: 400% 400%;
  animation: bgShift 16s ease infinite;
  position: relative;
  overflow-x: hidden;
}

body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.35;
  z-index: -1;
  pointer-events: none;
}
body::before {
  width: 320px; height: 320px;
  background: #ff7eb6;
  top: 10%; left: 5%;
  animation: floatA 12s ease-in-out infinite;
}
body::after {
  width: 260px; height: 260px;
  background: #7ec8ff;
  bottom: 8%; right: 6%;
  animation: floatB 14s ease-in-out infinite;
}

@keyframes bgShift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes floatA {
  0%, 100% { transform: translate(0, 0); }
  50%      { transform: translate(60px, 40px); }
}
@keyframes floatB {
  0%, 100% { transform: translate(0, 0); }
  50%      { transform: translate(-50px, -30px); }
}
  </style>
</head>
<body>
  <div class="layout">

    <aside class="sidebar">
      <div class="sidebar-top">
        <button id="newChat" class="new-chat" type="button">+ New chat</button>
        <input id="search" class="search-box" type="text" placeholder="Search chats...">
      </div>
      <div class="projects-head">
        <span>Projects</span>
        <button id="newProject" type="button" title="New project">+</button>
      </div>
      <div id="projectList" class="project-list"></div>
      <div id="chatList" class="chat-list"></div>
    </aside>

    <main class="main">
<div class="main-header"><span class="brand-spark"></span><span class="brand-text">Friendly <em>AI</em></span></div>
      <form id="chatForm">
        <textarea id="input" rows="2" placeholder="Type a message... (Enter to send, Shift+Enter for a new line)"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </main>

  </div>

  <script src="/chat.js"></script>
</body>
</html>
